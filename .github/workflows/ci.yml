name: Linux Build & AppImage Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Linux (Ubuntu 22.04 LTS x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Docker Build Environment
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image-cache
          key: ${{ runner.os }}-docker-build-qt68-${{ hashFiles('docker/olive-build-qt68/Dockerfile') }}

      - name: Load Docker Image from Cache (if exists)
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-image-cache/olivelan-build-qt68.tar

      - name: Build Docker Image (Ubuntu 22.04 + Qt 6.8 + OCIO 2.5 + FFmpeg 6.1)
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          docker build \
            -t olivelan-build-qt68:latest \
            -f docker/olive-build-qt68/Dockerfile docker/olive-build-qt68
          mkdir -p /tmp/docker-image-cache
          docker save olivelan-build-qt68:latest -o /tmp/docker-image-cache/olivelan-build-qt68.tar

      - name: Compile Olivelan & Run CTest Suite in Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            olivelan-build-qt68:latest \
            bash -c "
              set -euo pipefail
              export CMAKE_PREFIX_PATH='/opt/Qt/6.8.3/gcc_64;/usr/local'
              export LD_LIBRARY_PATH='/usr/local/lib:/opt/Qt/6.8.3/gcc_64/lib'
              export PATH='/opt/Qt/6.8.3/gcc_64/bin:\$PATH'

              echo '[INFO] Configuring CMake...'
              cmake -S . -B build \
                -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=ON

              echo '[INFO] Compiling all targets...'
              ninja -C build

              echo '[INFO] Running full CTest verification suite...'
              ctest --test-dir build --output-on-failure
            "

      - name: Build Standalone Fat AppImage
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            olivelan-build-qt68:latest \
            bash -c "
              set -euo pipefail
              export CMAKE_PREFIX_PATH='/opt/Qt/6.8.3/gcc_64;/usr/local'
              export LD_LIBRARY_PATH='/usr/local/lib:/opt/Qt/6.8.3/gcc_64/lib'
              export PATH='/opt/Qt/6.8.3/gcc_64/bin:\$PATH'

              echo '[INFO] Packaging self-contained Linux distribution directory...'
              BUILD_DIR=/workspace/build bash scripts/dist/build_linux_dist.sh

              echo '[INFO] Packaging standalone AppImage...'
              DIST_DIR=/workspace/dist/linux-x86_64 \
              APPDIR=/workspace/dist/AppDir \
              OUT=/workspace/dist/Olivelan-linux-x86_64.AppImage \
              bash scripts/dist/build_linux_appimage.sh
            "

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Olivelan-linux-x86_64.AppImage
          path: dist/Olivelan-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Release AppImage on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Olivelan-linux-x86_64.AppImage
          generate_release_notes: true
