<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 278" width="278" height="278">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6C8C4F"/>
      <stop offset="100%" stop-color="#64844A"/>
    </linearGradient>

    <!-- Film screen: darker inset shadow at top and bottom -->
    <linearGradient id="screen" x1="0" y1="76" x2="0" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F4433"/>
      <stop offset="12%" stop-color="#4A683F"/>
      <stop offset="86%" stop-color="#4A683F"/>
      <stop offset="100%" stop-color="#2F4433"/>
    </linearGradient>

    <!-- Extra virgin olive fruit shading -->
    <linearGradient id="fruit" x1="158" y1="178" x2="204" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B7C353"/>
      <stop offset="42%" stop-color="#A6B249"/>
      <stop offset="100%" stop-color="#7F9038"/>
    </linearGradient>
  </defs>

  <!-- 1. Rounded application tile -->
  <rect x="4" y="6" width="266" height="266" rx="25" ry="25" fill="url(#tile)"/>

  <!-- 2. Motion speed lines (translucent cream) -->
  <g fill="#C8CF9C">
    <rect x="58" y="72" width="43" height="13" rx="6.5"/>
    <rect x="30" y="105" width="71" height="13" rx="6.5"/>
    <rect x="58" y="136" width="42" height="13" rx="6.5"/>
    <rect x="36" y="165" width="50" height="13" rx="6.5"/>
  </g>

  <!-- 3. Film strip frame -->
  <rect x="100" y="62" width="120" height="118" rx="8" ry="8" fill="#F4F0D8"/>

  <!-- 3a. Screen window -->
  <rect x="129" y="76" width="64" height="89" fill="url(#screen)"/>

  <!-- 3b. Sprocket holes -->
  <g fill="#42613F">
    <rect x="112" y="75"  width="10" height="10" rx="2"/>
    <rect x="112" y="95"  width="10" height="10" rx="2"/>
    <rect x="112" y="115" width="10" height="10" rx="2"/>
    <rect x="112" y="135" width="10" height="10" rx="2"/>
    <rect x="112" y="155" width="10" height="10" rx="2"/>

    <rect x="201" y="75"  width="10" height="10" rx="2"/>
    <rect x="201" y="95"  width="10" height="10" rx="2"/>
    <rect x="201" y="115" width="10" height="10" rx="2"/>
    <rect x="201" y="135" width="10" height="10" rx="2"/>
    <rect x="201" y="155" width="10" height="10" rx="2"/>
  </g>

  <!-- 3c. Play glyph -->
  <path d="M148 102 L176 120 L148 137 Z" fill="#F4F3E6"
        stroke="#F4F3E6" stroke-width="3" stroke-linejoin="round"/>

  <!-- 4. Olive branch leaves (behind the fruit, in front of the frame) -->
  <g>
    <!-- tall leaf pointing up-right, crossing the right band of the film frame -->
    <path d="M188 192 Q231 174 236 104 Q191 120 188 192 Z" fill="#344C33"/>
    <!-- short leaf pointing up-right -->
    <path d="M200 181 Q232 190 256 158 Q226 156 200 181 Z" fill="#3B5437"/>
    <!-- thin leaf pointing right -->
    <path d="M203 184 Q226 176 244 197 Q220 200 203 184 Z" fill="#354D35"/>
    <!-- long leaf pointing down-left -->
    <path d="M172 184 Q138 174 113 207 Q148 217 172 184 Z" fill="#304834"/>
  </g>

  <!-- 5. Olive fruit -->
  <g>
    <path d="M 178 170 C 196 171, 204.5 185, 203.5 199 C 202.5 215, 188 229, 171 232 C 157 226, 152 212, 153.5 200.5 C 155 185, 164 171, 178 170 Z" fill="url(#fruit)"/>
    <!-- specular highlight -->
    <ellipse cx="180" cy="179" rx="9" ry="5.5" transform="rotate(-35 180 179)" fill="#CFD48C" opacity="0.95"/>
  </g>
</svg>
